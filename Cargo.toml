[package]
name = "nrzfitness"
version = "1.2.0"
edition = "2024"
description = "nrzFitness – Ernährung, Training, Körper, Fasten und Gesundheit an einem Ort (Dioxus + nrzUI)"
license = "MIT"

[[bin]]
name = "nrzfitness"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.7", features = ["router", "fullstack"] }
icons = { version = "0.19", features = ["dioxus"] }
tw_merge = { version = "0.1", features = ["debug"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde", "js"] }

# Server-only
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "json", "macros", "migrate"], optional = true }
dotenv = { version = "0.15", optional = true }
tokio = { version = "1", features = ["fs", "rt", "macros", "process", "time", "io-util"], optional = true }
base64 = { version = "0.22", optional = true }
tracing = { version = "0.1", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"], optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }
quick-xml = { version = "0.37", optional = true }

[lints.clippy]
dbg_macro = "deny"
print_stdout = "deny"
todo = "deny"
await_holding_lock = "deny"

[features]
default = []
server = ["dioxus/server", "dep:sqlx", "dep:dotenv", "dep:tokio", "dep:tracing", "dep:reqwest", "dep:base64", "dep:futures-util", "dep:zip", "dep:quick-xml"]
web = ["dioxus/web"]

[dev-dependencies]
sha2 = "0.10"
